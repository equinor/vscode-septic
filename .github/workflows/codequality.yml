name: "💎 Code Quality"
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      insiders:
        description: Run integration tests on VS Code Insiders instead of minimum and stable
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  code_quality:
    name: "🧪 Lint & Test Packages"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 📦 Install dependencies
        run: pnpm install
      - name: 🛠️ Build Packages
        run: pnpm -r build
      - name: 🧹 Lint Packages
        run: pnpm -r lint
      - name: 🧪 Run Unit tests
        run: xvfb-run --auto-servernum pnpm -r test
      - name: 🧪 Run Integration tests
        if: ${{ !inputs.insiders }}
        run: xvfb-run --auto-servernum pnpm -r integration-test
      - name: Run integration tests on Insiders
        if: ${{ inputs.insiders }}
        working-directory: packages/extension
        run: |
          pnpm build:test
          xvfb-run --auto-servernum pnpm exec vscode-test --label stable --code-version insiders
      - name: 🧪 Test Building of Extension
        run: cd packages/extension && npx @vscode/vsce package --no-dependencies
