[project]
name = "vscode-septic-scripts"
version = "0.1.0"
description = "Helper scripts for the VS Code Septic extension"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-dotenv", "pyyaml", "requests", "urllib3>=2.5.0"]

[dependency-groups]
dev = ["black", "ruff", "types-pyyaml"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP"]
